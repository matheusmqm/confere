# Custos típicos FICTÍCIOS (porém plausíveis) por código de custo, usados só para gerar
# provisões sintéticas (CF-31). Nada aqui é tabela real de preços.
#
# Campos de cada código:
#   tipo_fornecedor  tipos de fornecedor que podem cobrar o código (lista)
#   moeda            moeda da provisão
#   base             valor unitário; nos códigos com `percentual_de`, é o percentual (8 = 8%)
#   unidade          igual ao catálogo (config/codigos_custo.yaml)
#   ruido_rel        desvio-padrão relativo do ruído gaussiano aplicado ao valor
#   prob             probabilidade de o processo ter a provisão (1.0 = sempre, se aplicável)
#   percentual_de    `cif` ou outro código de custo cujo valor é a base do percentual
#   minimo           piso do valor calculado por percentual (antes do ruído)
#   dias             faixa sorteada de dias para códigos por_dia (valor = base x contêineres x dias)
#
# Quantidade: por_conteiner = nº de contêineres; por_bl = nº de BLs house; por_processo = 1.
versao: 1

# BRL por unidade de moeda estrangeira. Fictício: só converte bases percentuais entre moedas.
cambio_referencia: {BRL: 1.00, USD: 5.40, EUR: 6.30, CNY: 0.75}

# Valor CIF fictício de um processo = nº de contêineres x sorteio uniforme nesta faixa (BRL).
cif_por_conteiner_brl: [180000, 420000]

codigos:
