repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: ^data/(seed42|llm_cache)/
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: prettier
        name: prettier (apps/web)
        entry: pnpm -C apps/web exec prettier --check .
        language: system
        files: ^apps/web/
        exclude: ^apps/web/(\.next|node_modules)/
        pass_filenames: false
