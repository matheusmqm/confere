[project]
name = "confere-api"
version = "0.1.0"
description = "API FastAPI e worker do Confere."
requires-python = ">=3.12,<3.13"
dependencies = [
    "confere-core",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pgvector>=0.4",
    "pydantic-settings>=2.11",
    "boto3>=1.40",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.0",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "itsdangerous>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confere_api"]
