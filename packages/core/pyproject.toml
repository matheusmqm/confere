[project]
name = "confere-core"
version = "0.1.0"
description = "Pipeline puro E1–E10 do Confere."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "numpy>=2.3",
    "scipy>=1.16",
    "ortools>=9.14",
    "scikit-learn>=1.7",
    "pymupdf>=1.26",
    "google-genai>=1.50",
    "structlog>=25.4",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confere_core"]
